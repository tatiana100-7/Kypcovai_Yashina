<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luxorides — вход и регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <header class="auth-header">
    <div class="auth-header__inner">
      <a class="auth-header__logo" href="index.html">
        <img class="auth-header__logo-img" src="images/logo.png" alt="Luxorides">
      </a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card">

      <!-- Вход и регистрация -->
      <div class="auth-box" id="authBox">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tabs__tab is-active" id="tabLogin" type="button" role="tab" aria-selected="true">Вход</button>
          <button class="auth-tabs__tab" id="tabRegister" type="button" role="tab" aria-selected="false">Регистрация</button>
        </div>

        <form class="auth-form" id="loginForm" novalidate>
          <h1 class="auth-form__title">Войти в аккаунт</h1>
          <p class="auth-form__subtitle">Введите email и пароль, указанные при регистрации</p>

          <div class="auth-field">
            <input class="auth-field__input" type="email" name="email" placeholder="Email" autocomplete="email">
            <p class="auth-field__error" data-error="email"></p>
          </div>
          <div class="auth-field">
            <div class="auth-pass">
              <input class="auth-pass__input" type="password" name="password" placeholder="Пароль" autocomplete="current-password">
              <button class="auth-pass__eye" type="button">Показать</button>
            </div>
            <p class="auth-field__error" data-error="password"></p>
          </div>
          <label class="auth-remember">
            <input class="auth-remember__box" type="checkbox" name="remember" checked>
            <span class="auth-remember__text">Запомнить меня</span>
          </label>
          <button class="auth-form__btn" type="submit">Войти</button>
          <p class="auth-form__msg" data-msg role="status"></p>
          <p class="auth-form__switch">Нет аккаунта? <button class="auth-form__link" type="button" data-go="register">Зарегистрироваться</button></p>
        </form>

        <form class="auth-form" id="registerForm" novalidate hidden>
          <h1 class="auth-form__title">Создать аккаунт</h1>
          <p class="auth-form__subtitle">Регистрация займёт меньше минуты</p>

          <div class="auth-field">
            <input class="auth-field__input" type="text" name="name" placeholder="Ваше имя" autocomplete="name">
            <p class="auth-field__error" data-error="name"></p>
          </div>
          <div class="auth-field">
            <input class="auth-field__input" type="email" name="email" placeholder="Email" autocomplete="email">
            <p class="auth-field__error" data-error="email"></p>
          </div>
          <div class="auth-field">
            <input class="auth-field__input" type="tel" name="phone" placeholder="Ваш телефон" autocomplete="tel">
            <p class="auth-field__error" data-error="phone"></p>
          </div>
          <div class="auth-field">
            <label class="auth-field__label" for="regBirth">Дата рождения (регистрация только с 18 лет)</label>
            <input class="auth-field__input" type="date" id="regBirth" name="birth" autocomplete="bday">
            <p class="auth-field__hint" data-age></p>
            <p class="auth-field__error" data-error="birth"></p>
          </div>
          <div class="auth-field">
            <div class="auth-pass">
              <input class="auth-pass__input" type="password" name="password" placeholder="Пароль (минимум 6 символов)" autocomplete="new-password">
              <button class="auth-pass__eye" type="button">Показать</button>
            </div>
            <p class="auth-field__error" data-error="password"></p>
          </div>
          <div class="auth-field">
            <div class="auth-pass">
              <input class="auth-pass__input" type="password" name="password2" placeholder="Повторите пароль" autocomplete="new-password">
              <button class="auth-pass__eye" type="button">Показать</button>
            </div>
            <p class="auth-field__error" data-error="password2"></p>
          </div>
          <button class="auth-form__btn" type="submit">Зарегистрироваться</button>
          <p class="auth-form__msg" data-msg role="status"></p>
          <p class="auth-form__switch">Уже есть аккаунт? <button class="auth-form__link" type="button" data-go="login">Войти</button></p>
        </form>
      </div>
    </section>

    <img class="auth-car" src="images/urus.png" alt="Lamborghini Urus">
  </main>

  <script src="auth-core.js"></script>
  <script src="auth.js"></script>
</body>
</html>
